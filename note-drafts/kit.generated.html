<script>
const DAYS = [{"date":"2026-08-30","title":"本業の空きコマだけで月2.5万円。未経験から「オンライン家庭教師・スキルシェア」を始めてみた話","price":"480円","freePart":"副業として最初に思いついたのは、ライティングでも物販でもなく「人に教える」ことでした。学生時代に家庭教師のアルバイトをしていた経験があったので、それをオンラインでもう一度やってみようと思ったのがきっかけです。\n\nとはいえ、教育系の副業と聞くと「資格が必要そう」「生徒集めが大変そう」というイメージが先に立って、結局始めるまでに数ヶ月かかりました。でも実際にやってみたら、必要だったのは特別な資格でも大きな初期投資でもなく、プロフィールの書き方と最初の数回の進め方を知っているかどうかだけでした。\n\n平日夜の空きコマ2枠と週末の1枠、合計週3コマ程度を続けて、今は月2.5万円ほどの収入になっています。大きな金額ではありませんが、本業に影響が出ない範囲で無理なく続けられているのが自分に合っていると感じています。\n\nこの記事では、\n\n- なぜ「教える」副業は初心者でも参入しやすいのか\n- 実際に登録から初回体験レッスンまでどう進めたか\n- 生徒がいない状態から最初の1人を獲得するまでにやったこと\n- 単価と時間の決め方、続けるための工夫\n\nを、実体験ベースでまとめます。\n\n### この記事の有料パートで分かること\n\n- プロフィール・自己紹介文で実際に反応が変わった書き方\n- 初回体験レッスンで意識していること(継続してもらうための組み立て)\n- 生徒ゼロから最初の1人を獲得するまでの具体的な動き方\n- 単価設定の考え方と、無理なく続けるためのコマ数の決め方","paidPart":"## なぜ「教える」副業は初心者でも参入しやすいのか\n\n家庭教師やスキルシェアというと、教員免許や専門資格が必要だと思われがちですが、多くのスキルシェア系プラットフォームでは「その分野を人に教えられるレベルであること」が基準になっており、学歴や資格の証明を厳密に求められないケースがほとんどです。私が教えているのも、資格が必要な専門科目ではなく、自分が受験や学生時代に実際にやってきた勉強法や教科の基礎です。\n\n初期費用もほぼかかりませんでした。必要だったのは、パソコンとカメラ、そして安定した通信環境くらいで、教材は市販のものや自作の資料で十分でした。この「始めるハードルの低さ」が、他の副業と比べて参入しやすいと感じた一番の理由です。\n\n## 登録から初回体験レッスンまでの流れ\n\n私が実際に踏んだ流れは、こんな感じでした。\n\n1. スキルシェア系のプラットフォームに登録し、プロフィールを作成する\n2. 教えられる内容・対象(学年や科目、レベル)を具体的に書く\n3. 体験レッスンの枠を作り、価格を「まずは知ってもらう」ための低め設定にする\n4. 体験レッスンで、生徒の現状の悩みをヒアリングし、次回以降の進め方を一緒に決める\n\nこのうち、一番効果があったのはプロフィールの書き方でした。最初は「〇〇教えます」とだけ書いていて、反応はほとんどありませんでした。試しに「対象者」「現状よくある悩み」「レッスンで得られる変化」の3つを具体的に書くように変えてみたところ、問い合わせの数が明らかに増えました。抽象的な「教えます」ではなく、「こういう人の、こういう悩みを、こう変える」という形にしたことが効いたのだと思います。\n\n## 初回体験レッスンで意識していること\n\n初回体験レッスンでは、内容そのものよりも「この人にお願いすれば続けられそうだ」と思ってもらうことを優先しています。具体的にやっているのは、この3つです。\n\n- 最初の5分で、今困っていることを丁寧にヒアリングする\n- その場で解ける小さな問題を一緒に解いて、「分かった」という体験を作る\n- 最後に、今後どう進めていくかの見通し(回数・ペース・目標)を具体的に伝える\n\n初回でいきなり大量の内容を詰め込むより、「次も続けたい」と思ってもらえるかどうかを重視するようにしてから、体験から継続への移行率が上がったと感じています。\n\n## 生徒ゼロから最初の1人を獲得するまで\n\n正直に書くと、登録してからしばらくは問い合わせが一件も来ませんでした。プロフィールを見直し、体験レッスンの価格を下げ、対応可能な時間帯を増やしてから、ようやく最初の問い合わせが来ました。\n\n最初の生徒に来てもらうまでにやったことを振り返ると、\n\n- プロフィール写真を、顔がはっきり分かる明るいものに変更する\n- 対応可能時間を平日夜と週末に広げ、選ばれやすくする\n- 体験レッスンの価格を、通常レッスンより下げて「試しやすさ」を作る\n- 最初の数件は、良い評価をもらうことを優先する(単価より実績)\n\nだいたいこの4つです。特に評価・レビューがまだない状態では、価格や時間の融通で「試してもらいやすさ」を作ることが、最初の一歩としては有効だったと感じています。\n\n## 単価設定の考え方と続けるための工夫\n\n単価は、最初から高く設定せず、評価が貯まってから少しずつ見直す方針にしています。最初の数ヶ月は相場よりやや低めに設定し、レビューが一定数貯まった段階で見直しました。\n\nコマ数についても、本業に無理のない範囲(週2〜3コマ)を上限に決めています。空いた時間をすべて埋めようとすると準備の負担が大きくなり続かなくなるため、「無理なく続けられる範囲」を優先するようにしてから、半年以上続けられています。\n\n## まとめ\n\n- 家庭教師・スキルシェア系の副業は、資格や大きな初期投資がなくても始めやすい\n- プロフィールは「対象者」「悩み」「変化」を具体的に書くと反応が変わる\n- 生徒ゼロから最初の1人までは、体験価格を下げる・対応時間を広げるなど「試してもらいやすさ」がカギ\n- 単価は最初から高くせず、評価が貯まってから見直す\n- コマ数は本業に無理のない範囲に絞ることで、無理なく続けられる\n\n収入は大きくなくても、本業の空き時間で無理なく続けられる副業を探している人には、選択肢の一つとして向いていると思います。質問があればコメントで気軽にどうぞ。","xPosts":[{"num":"01","label":"結果訴求","body":"本業の空きコマだけで、月2.5万円になりました。\n資格も大きな初期費用もいりません。やったのは「教える」を副業にしただけです。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"02","label":"共感フック","body":"副業を始めるとき、「教育系は資格が必要そう」と思って数ヶ月迷っていました。\n実際は、プロフィールの書き方と最初の数回の進め方を知っているかどうかだけでした。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"03","label":"数字訴求","body":"平日夜2枠+週末1枠、週3コマ程度を続けて月2.5万円ほど。\n本業に影響が出ない範囲で、無理なく続けられています。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"04","label":"逆説型","body":"「教育系の副業=生徒集めが大変」と思っていました。\n実際に大変だったのはそこではなく、プロフィールの書き方でした。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"05","label":"失敗談","body":"最初は「〇〇教えます」とだけ書いたプロフィールで、問い合わせはほぼゼロでした。\n書き方を変えただけで、反応が明らかに変わった話です。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"06","label":"悩み提起","body":"「教える副業、興味あるけど資格ないし…」\nその悩み、実は多くのスキルシェア系プラットフォームでは資格の証明を厳密に求められません。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"07","label":"スレッド導入・ノウハウ小出し1","body":"1/ 本業の空きコマだけで、月2.5万円になりました。\n登録から最初の生徒獲得まで、実際にやったことを話します🧵"},{"num":"08","label":"具体手順","body":"やったことはシンプル。\n①プラットフォーム登録・プロフィール作成 ②体験レッスンを低価格で設定 ③ヒアリングして継続の見通しを伝える\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"09","label":"ターゲット限定","body":"・教える副業に興味あるけど資格がない\n・生徒集めのやり方が分からない\n・本業に無理のない範囲で始めたい\nそんな人向けの話です。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"10","label":"プロフィール訴求","body":"プロフィールを「対象者」「悩み」「変化」の3つを具体的に書く形に変えたら、問い合わせが明らかに増えました。\nその書き方を詳しくまとめています。\n#副業 #お金の勉強 #スキルシェア\n[URL]"}, じゃなく、問い合わせゼロだった時期のことも込みで書きました。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"27","label":"再エンゲージ・質問投げかけ","body":"教える副業、興味はあるけど何から始めればいいか分からない。\nそんな方向けに、実際の始め方をまとめています。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"28","label":"締めくくり訴求","body":"本業の空きコマだけで月2.5万円になった、オンライン家庭教師・スキルシェアの始め方。実体験ベースでまとめました。\n気になった方はこちらからどうぞ。\n#副業 #お金の勉強 #スキルシェア\n[URL]"},{"num":"29","label":"スレッド3・要約系","body":"1/ 教える副業を振り返って、登録から生徒獲得までの流れと、続けるための工夫をまとめました。\nプロフィールの書き方まで全部書きます🧵"},{"num":"30","label":"ラストコール・落ち着いたトーン","body":"資格がない、経験もそんなにない。それでも「教える」を副業にできた、という話です。\n興味があれば、コメントで気軽に聞いてください。\n#副業 #お金の勉強 #スキルシェア\n[URL]"}],"designUrl":"https://claude.ai/code/artifact/2cc5f302-28e2-49ad-96d1-820718c60407"},{"date":"2026-08-29","title":"副業のお金、口座を分けたら管理がラクになった話","price":"380円","freePart":"副業を始めて一番困ったのは、実は「稼ぎ方」より「お金の管理」でした。\n\n入金は普段使っている口座にそのまま入ってくるので、生活費と副業のお金が完全に混ざってしまって、今月いくら副業で稼いだのか、経費にいくら使ったのか、確定申告の時期になるまで把握できていませんでした。手取りは増えているはずなのに、実感がまったくない、という状態が続いていました。\n\nこれを変えたのが、口座を分けるという単純な工夫でした。特別な家計簿アプリを入れたわけでも、経理の知識を勉強したわけでもありません。やったのは、口座それぞれに役割を決めただけです。\n\nこの記事では、\n- なぜ副業のお金は管理が難しくなるのか\n- 実際に分けている口座の構成と、それぞれの役割\n- 税金分をあらかじめ取り分けておく考え方\n- 毎月のお金の流れをどう回しているか\n\nを、実体験ベースでまとめます。\n\n### この記事の有料パートで分かること\n\n- 実際に使っている口座構成(何用の口座を何個持っているか)\n- 税金分を取り分ける割合の考え方\n- 毎月やっているお金の移動ルーティン\n- 手取りが「見える化」されたことで変わったこと","paidPart":"## なぜ副業のお金は管理が難しくなるのか\n\n生活費用の口座に副業の入金がそのまま入ってくると、「今月の生活費」と「副業の売上」が同じ数字の中に混ざってしまいます。私自身、最初の半年くらいはまさにこの状態で、通帳を見ても、使っていいお金なのか、税金や経費のために残しておくべきお金なのか判断がつかず、「今、実質いくら自由に使えるのか」もまったく分からないまま過ごしていました。\n\n## 実際に分けている口座の構成\n\n今は、目的ごとに口座を分けています。\n\n- **生活費用の口座**:これまで通り、給与や生活費の支払いに使う\n- **副業の入金専用口座**:副業の売上はすべてここに入るようにする\n- **税金・経費の取り分け用口座**:副業の入金専用口座から、一定割合を毎月移動させる\n\n副業の入金専用口座を作ったことで、**「副業でいくら入ってきたか」が一目で分かる**ようになりました。これだけでも、確定申告の時期の集計がかなり楽になりました。\n\n## 税金分を取り分ける割合の考え方\n\n副業の所得には所得税・住民税がかかります。正確な税額は所得や控除によって変わるため、私は多少余裕を持たせて、**入金額の2割程度**を税金・経費の取り分け用口座に移すようにしています。\n\n年度末に取り分けた分が余れば、それはそのまま自分へのボーナスのようなものですし、逆に足りなくなるよりはずっと安心です。この割合はあくまで私自身の目安で、所得水準によって適切な割合は変わるため、不安な場合は税理士や税務署に相談しながら自分に合った割合を決めるのが確実だと思います。\n\n## 毎月やっているお金の移動ルーティン\n\nやっていることはシンプルで、月に1回、決まったタイミングで次の作業をするだけです。\n\n1. 副業の入金専用口座の残高を確認する\n2. その月の入金額の2割を、税金・経費の取り分け用口座に移す\n3. 残った金額のうち、生活費に回したい分だけを生活費用の口座に移す\n4. 残りは副業の入金専用口座に置いたまま、次の投資や備えに回す\n\nこの「月1回、決まった作業をするだけ」というやり方に変えてから、家計簿アプリを毎日つけるような細かい管理をしなくても、お金の流れが自然と把握できるようになりました。\n\n## 手取りが「見える化」されたことで変わったこと\n\n一番大きかったのは、**「今、実質いくら自由に使えるお金があるのか」が即座に分かるようになった**ことです。\n\n以前は、副業が順調なのか不調なのか、通帳の数字だけでは実感が湧きませんでした。今は口座を見るだけで、今月の副業の調子や、税金分としてどれくらい確保できているかがすぐに分かります。この安心感は、想像していた以上に大きいものでした。\n\n## まとめ\n\n- 生活費と副業のお金が同じ口座で混ざると、手取りの実感が持てなくなる\n- 副業の入金専用口座を作るだけで、売上の把握がぐっと楽になる\n- 入金額の一定割合(私の場合は2割目安)を税金・経費用に取り分けておくと安心\n- 月1回のお金の移動ルーティンだけで、細かい家計簿をつけなくても管理できる\n\n副業を始めたばかりで「稼いだお金がどこに消えているか分からない」と感じている人は、口座を分けるところから始めてみると、感覚がだいぶ変わると思います。質問があればコメントで気軽にどうぞ。","xPosts":[{"num":"01","label":"結果訴求","body":"副業のお金、口座を分けたら管理がラクになりました。\n特別なアプリも家計簿スキルもいりません。やったのは口座の役割を決めただけです。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"02","label":"共感フック","body":"副業を始めて一番困ったのは「稼ぎ方」より「お金の管理」でした。\n生活費と混ざって、手取りの実感がまったく持てなかった話です。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"03","label":"数字訴求","body":"副業の入金額の2割を、税金・経費の取り分け用口座に移す。\nこれだけで、確定申告の時期に慌てることがなくなりました。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"04","label":"逆説型","body":"家計簿アプリを毎日つけるのをやめました。\n代わりに、月1回口座を移すだけのルーティンにしたら、逆に管理が楽になりました。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"05","label":"失敗談","body":"入金は生活費用の口座にそのまま入れていました。\n今月いくら稼いだのか、確定申告の時期まで分からない状態が半年続いていました。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"06","label":"悩み提起","body":"「副業、稼いでいるはずなのに手取りの実感がない」\nそれ、口座が分かれていないだけかもしれません。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"07","label":"スレッド導入・ノウハウ小出し1","body":"1/ 副業のお金、口座を分けたら管理がラクになりました。\n生活費・入金・税金、それぞれの口座の役割を話します🧵"},{"num":"08","label":"具体手順","body":"やっていることはシンプル。\n①副業入金は専用口座へ ②2割を税金用口座へ ③残りを生活費・貯め置きに振り分け\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"09","label":"ターゲット限定","body":"・副業のお金が生活費と混ざっている\n・確定申告の時期に集計が大変\n・手取りの実感が持てない\nそんな人向けの話です。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"10","label":"ルーティン訴求","body":"月1回、決まったタイミングで口座を移すだけ。\nこのルーティンにしてから、お金の流れが自然と把握できるようになりました。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"11","label":"Q&A風","body":"Q. 口座を分けるの、面倒じゃない?\nA した。\n気になった方はこちらからどうぞ。\n#副業 #お金の勉強 #家計管理\n[URL]"},{"num":"29","label":"スレッド3・要約系","body":"1/ 副業のお金の管理を振り返って、口座構成と月1回のルーティンをまとめました。\n税金の取り分け方まで全部書きます🧵"},{"num":"30","label":"ラストコール・落ち着いたトーン","body":"副業のお金、どこに消えているか分からないという人は、口座を分けるところから試してみてください。\n質問があればコメントでどうぞ。\n#副業 #お金の勉強 #家計管理\n[URL]"}],"designUrl":"https://claude.ai/code/artifact/2959d418-c54e-4eca-bbc5-5a9cefa2b940"},{"date":"2026-08-28","title":"提案文・見積書、ChatGPT/Claudeで時短作成してみた話","price":"480円","freePart":"副業の案件が増えてくると、気づけば地味に時間を食っていたのが「提案文」と「見積書」でした。案件ごとに内容が微妙に違うので、コピペだけでは済まず、毎回ゼロから文面を考え直すのに30分以上かかることもざらでした。\n\n作業そのものより、この「書類作成の時間」がボトルネックになっている感覚があって、ここにChatGPT/Claudeを使うようにしてから、案件対応にかけられる時間が明らかに増えました。\n\n今回は、そのあたりの話を書いていきます。\n\n- 提案文・見積書の作成にAIを使うと、何がどう時短になるのか\n- 実際に使っているプロンプトの型\n- AIに書かせたものをそのまま出さないために気をつけていること\n- 時短できた分、何に時間を使うようになったか\n\nこのへんを、実際にやっている手順そのまま書きます。\n\n### この記事の有料パートで分かること\n\n- 提案文・見積書作成で実際に使っているプロンプトの型\n- ベーステンプレート+AIによる個別調整の具体的な進め方\n- AIの出力をそのまま出さないためのチェックポイント\n- 時短で浮いた時間の使い道","paidPart":"## 何がどう時短になるのか\n\n提案文や見積書は、案件ごとに「相手の要望」「自分の強み」「金額の根拠」を組み合わせて書く必要があります。この組み合わせを考える部分、つまり**構成を考える時間**が一番かかっていました。\n\n私がAIに任せているのは、まさにこの構成を考える部分です。案件の概要と自分の実績を伝えると、たたき台になる構成がすぐ返ってきます。真っ白な画面と向き合う時間がなくなっただけで、体感の作業時間はかなり短くなりました。\n\n## 実際に使っているプロンプトの型\n\n私が使っているプロンプトは、だいたいこのような形です。\n\n> 以下の案件に対する提案文を作成してください。\n> 案件概要:○○\n> 自分の実績:○○件対応、得意分野は○○\n> 希望金額:○○円(理由も添えて)\n> トーン:丁寧だが硬すぎない、初めて依頼する相手にも伝わる文章で\n\nポイントは、**案件概要・実績・金額・トーンの4つを毎回同じフォーマットで入力する**ことです。この型を決めてからは、入力の手間自体もかなり減りました。\n\n見積書も同じで、項目・単価・数量・備考をリストで渡すと、見た目のきれいな体裁にすぐ整えてくれます。\n\n## AIの出力をそのまま出さないために気をつけていること\n\nAIが作った文面をそのまま送ることはしていません。理由は大きく2つあります。\n\n1. **AIは実績や金額の数字を、それらしく整えてしまうことがある**ため、事実と違う表現になっていないか必ず確認する\n2. **文面がどうしても「よくある丁寧な文章」に寄りがちで、自分らしさが薄れる**ため、実際のエピソードや言い回しを1〜2箇所、自分の言葉に直す\n\n特に2つ目は重要だと感じています。AIが作った構成のまま出すと、他の人と似たような提案文になりやすく、発注者の印象に残りにくいと感じることがありました。たたき台として使い、最後は自分の言葉で仕上げる、という役割分担を意識しています。\n\n## 時短で浮いた時間の使い道\n\n提案文・見積書の作成時間が減った分、私は新規案件の**リサーチ**に時間を使うようになりました。発注者がどんな実績を求めていそうかを事前に調べてから提案文を作ると、通過率も上がる感覚があります。\n\n書類作成という「守り」の時間を削って、案件の質を見極める「攻め」の時間に回せるようになった、というのが一番の変化です。\n\n## まとめ\n\n- 提案文・見積書は、構成を考える部分が一番時間を取られていた\n- AIには「案件概要・実績・金額・トーン」を同じフォーマットで渡すと、たたき台がすぐに出てくる\n- AIの出力はそのまま出さず、事実確認と自分の言葉への調整を必ず行う\n- 浮いた時間は、案件のリサーチなど「攻め」の作業に使うと効果的\n\n書類作成に時間を取られている実感がある人は、一度この型を試してみてください。体感、けっこう変わると思います。質問があれば気軽にコメントください。","xPosts":[{"num":"01","label":"結果訴求","body":"提案文・見積書の作成、ChatGPT/Claudeに任せるようにしてから時間が大幅に減りました。\n案件対応にかけられる時間が増えた話です👇\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"02","label":"共感フック","body":"副業の案件が増えるほど地味に時間を食っていたのが「提案文」と「見積書」でした。\nここをAIで時短した話をまとめました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"03","label":"数字訴求","body":"提案文1本にゼロから30分以上かかっていました。\nAIにたたき台を作ってもらうようになってから、体感の作業時間がかなり短くなりました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"04","label":"逆説型","body":"AIに全部お任せ、ではありません。\nたたき台はAI、仕上げは自分の言葉に直す。この役割分担がポイントでした。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"05","label":"失敗談","body":"AIが作った文面をそのまま送っていた時期もありました。\n実績や金額の数字がそれらしく整えられていて、ヒヤッとしたことがあります。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"06","label":"悩み提起","body":"「提案文を書くのが面倒で、案件対応が後回しになる」\nそんな人へ、書類作成の時間を圧縮する型の話です。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"07","label":"スレッド導入・ノウハウ小出し1","body":"1/ 提案文・見積書の作成、ChatGPT/Claudeを使うようにしてから時間がかなり減りました。\n実際に使っているプロンプトの型を公開します🧵"},{"num":"08","label":"具体手順","body":"使っているプロンプトは4項目だけ。\n案件概要・実績・希望金額・トーン。これを毎回同じフォーマットで渡しています。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"09","label":"ターゲット限定","body":"・提案文や見積書の作成に時間を取られている\n・案件ごとに文面を考え直すのが面倒\n・AIを業務に使い始めたい\nそんな人向けの話です。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"10","label":"チェックポイント訴求","body":"AIの出力をそのまま出さないために気をつけていること、2つに絞って書いています。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"11","label":"Q&A風","body":"Q. AIに書類作成を任せると事務的になりすぎない?\nA. なるので、実際のエピソードを1〜2箇所は自分の言葉に直しています。\n詳しいやり方はこちら👇\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"12","label":"テンプレ公開訴求","body":"提案文作成で実際に使っているプロンプト、そのまま載せています。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"13","label":"比較訴求","body":"ゼロから白紙に向かう時間と、たたき台から仕上げる時間。\n体感の差はかなり大きかったです。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"14","label":"時間の使い道","body":"書類作成が減った分、新規案件のリサーチに時間を使うようになりました。\n「守り」の時間を「攻め」に回せたのが一番の変化です。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"15","label":"結果訴求・別角度","body":"見積書も、項目・単価・数量・備考をリストで渡すだけ。\n体裁を整える手間がなくなりました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"16","label":"共感・独白系","body":"正直、AIが作った文章のまま送りそうになったことが何度かあります。\nそこで決めたチェックポイント込みで書いています。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"17","label":"初心者向け","body":"副業でChatGPT/Claudeをまだ使い始めていない人へ。\n書類作成は、一番効果を実感しやすい使い道かもしれません。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"18","label":"自分らしさ訴求","body":"AIが作った構成のまま出すと、他の人と似た提案文になりがちでした。\n最後は自分の言葉に直す、その一手間が差になると感じています。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"19","label":"スレッド2/導入","body":"1/ AIの出力をそのまま出さないために、私が必ず確認していることを話します。\nこれをやらないと事故る、という話でもあります🧵"},{"num":"20","label":"需要背景","body":"提案文・見積書は、案件ごとに要望・実績・金額の組み合わせを考える必要があります。\nこの「構成を考える時間」が一番かかっていました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"21","label":"効率訴求","body":"入力のフォーマットを固定してからは、プロンプトを打つ手間自体も減りました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"22","label":"注意点訴求","body":"AIは実績や金額の数字を、それらしく整えてしまうことがあります。\n事実と違っていないか、送る前に必ず確認しています。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"23","label":"意外性","body":"AIに任せているのは文章そのものより「構成を考える部分」でした。\nここが一番時間を取られていたと気づいたのが発見でした。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"24","label":"まとめ訴求","body":"・何がどう時短になるのか\n・実際に使っているプロンプトの型\n・AIの出力をそのまま出さない工夫\n・時短で浮いた時間の使い道\nこれ全部、1本のnoteにまとめました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"25","label":"再訴求・別切り口","body":"書類作成という「守り」の時間を削ると、案件の質を見極める時間が増えました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"26","label":"信頼性訴求","body":"うまくいった話だけじゃなく、AIの出力をそのまま送りそうになった話も込みで書きました。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"27","label":"再エンゲージ・質問投げかけ","body":"提案文・見積書の作成にAIを使ったことはありますか?\n私が実際にやっている型をまとめています。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"28","label":"締めくくり訴求","body":"書類作成の時間を圧縮する、実際に使っているプロンプトの型をまとめました。\n気になった方はこちらからどうぞ。\n#副業 #お金の勉強 #AI活用\n[URL]"},{"num":"29","label":"スレッド3・要約系","body":"1/ 提案文・見積書をAIで時短作成するようになって変わったことを振り返ってまとめました。\nプロンプトの型から時間の使い道まで全部書きます🧵"},{"num":"30","label":"ラストコール・落ち着いたトーン","body":"書類作成に時間を取られている実感がある人は、一度試してみると体感が変わるかもしれません。\n質問があればコメントでどうぞ。\n#副業 #お金の勉強 #AI活用\n[URL]"}],"designUrl":"https://claude.ai/code/artifact/07241eb1-3ff2-45c4-963c-460b30d4da25"},{"date":"2026-08-27","title":"在庫ゼロ・原価ゼロ。Notion/Canvaテンプレートを作って売ってみた話","price":"580円","freePart":"副業でずっと「手を動かした分しか稼げない」ことに引っかかっていました。文字起こし代行も、単価交渉をしたライティングも、結局は自分の時間を切り売りしている感覚が拭えなくて、「一度作ったものが何度も売れる仕組み」に憧れていました。\n\nそこで始めたのが、NotionやCanvaのテンプレートを作って売ることでした(もちろん、Notion社やCanva社が配布している公式テンプレートではなく、自分がゼロから作ったものです)。在庫を抱える必要もないし、原価もほぼゼロ。一度ちゃんと作り込んでしまえば、同じデータを何人に売っても減るものではない、というのが単純に魅力的でした。\n\n正直、最初は「テンプレートなんて誰でも作れるものが売れるのか」と半信半疑でした。でも実際にやってみると、ちゃんと売れるテンプレートには共通点があり、作り方・売り方にコツがあることが分かってきました。\n\nこの記事では、\n- なぜ「誰でも作れそうなテンプレート」でも売れるのか\n- 実際に作って売ったテンプレートの種類と、売れたものの共通点\n- テンプレートの作り方と、noteでの販売の仕組み\n- 値付けと、売れ行きを伸ばすための紹介文の書き方\n\nを、実際にやってみて感じたことを交えながら書いていきます。\n\n### この記事の有料パートで分かること\n\n- 実際に売れたテンプレートの具体例と、売れなかったものとの違い\n- テンプレート作成から販売までの具体的な手順\n- 値付けの考え方と、実際の売上感覚\n- 紹介文(セールスコピー)のテンプレート","paidPart":"## なぜ「誰でも作れそうなテンプレート」でも売れるのか\n\nNotion や Canva は誰でも無料で使えるツールなので、「わざわざお金を払ってテンプレートを買う人がいるのか」と最初は疑っていました。\n\nでも実際に売ってみると、買ってくれた方から「ゼロから組み立てる時間がなくて助かりました」というコメントをもらうことが何度かあって、腑に落ちました。機能としては自分でも作れるはずのものでも、**構成を考える手間、デザインを整える手間を肩代わりしてもらえる**ことにお金を払ってもらえるんだ、と実際にやってみて分かりました。\n\n私が最初に作ったのは、副業の収支を管理するNotionテンプレートでした。案件ごとの単価や入金予定、経費があちこちのメモに散らばっていて、確定申告の時期になるたびに青くなっていたので、それを一覧で管理できるようにしたところ、自分自身が「これが欲しかった」と思うくらい快適になり、そのまま公開してみたら他の副業ワーカーにも刺さりました。\n\n## 実際に売れたテンプレートと、売れなかったものの違い\n\n売れたテンプレートに共通していたのは、**「自分が実際に使っていて、地味に助かっているもの」**だったことです。\n\n- 副業の収支管理Notionテンプレート(案件・単価・入金予定を一覧化)\n- クラウドソーシング提案文のCanvaテンプレート(実績紹介ページ付き)\n- SNS投稿用の週間コンテンツカレンダー(Notion)\n\n逆に、あまり売れなかったのは「なんとなく需要がありそうだから」で作った、自分では使っていないテンプレートでした。使ってもいないものは、細かい使いやすさの部分が甘くなりがちで、紹介文にも説得力が出ませんでした。\n\n## テンプレートの作り方と、noteでの販売の仕組み\n\n作り方自体は難しくありません。NotionまたはCanvaで実際に自分が使う形を作り込み、個人情報など公開したくない部分を消してから、複製・共有用のリンクを発行します。\n\nnoteでは、そのリンクをテキストとして有料パートに記載する形で販売しています。記事の無料パートで「どんなテンプレートか」「何が解決できるか」を説明し、有料パート以降にテンプレートへのリンクと使い方の説明を書く、というシンプルな構成です。\n\n画像でテンプレートのプレビューを見せることも忘れないようにしています。実物のイメージが湧かないと、購入のハードルが上がってしまうと感じたためです。\n\n## 値付けの考え方と、実際の売上感覚\n\n最初のテンプレートは580円で出しました。無料でも似たようなものが手に入る領域なので、高すぎる価格は避け、「気軽に試せる金額」を意識しています。\n\n売上自体は、記事単体の有料note(例えば議事録代行のノウハウ記事など)と比べると、1本あたりの反応はゆるやかです。それでも、**一度作ったものを継続的に販売できる**という点で、時間対効果は悪くないなという手応えがあります。同じ労力を新しい記事執筆に使うより、テンプレートを少しずつ増やしていく方が、後になって効いてくる感覚があります。\n\n## 紹介文(セールスコピー)のテンプレート\n\n実際に使っている紹介文の型はこのような形です。\n\n> 「○○のたびに、毎回ゼロから作るのが面倒」——そんな悩みを解決するために作った、○○用のテンプレートです。実際に私が副業で使っているものをそのまま公開しています。複製してすぐに使えます。\n\nポイントは、**「誰かの悩み」を先に言語化してから、「実際に使っているもの」であることを添える**ことです。テンプレート単体の説明を並べるよりも、「なぜこれが必要になったか」を先に書いたときの方が、反応が明らかに良かった、というのが自分の体感です。\n\n## まとめ\n\n- テンプレート販売が売れるのは、「作る手間を省く」という価値にお金が払われるから\n- 売れるテンプレートは、自分が実際に使っていて助かっているもの\n- 作り方はシンプルで、noteの記事にリンクと使い方を書く形で販売できる\n- 値付けは「気軽に試せる金額」から始め、紹介文は悩みを先に言語化する\n\n一度作ったものが繰り返し売れる仕組みは、時間を切り売りする副業とはやっぱり違う積み上がり方をするな、と実際にやってみて思います。質問があればコメントで気軽にどうぞ。","xPosts":[{"num":"01","label":"結果訴求","body":"在庫ゼロ・原価ゼロ。Notion/Canvaのテンプレートを作って売ってみました。\n一度作れば、同じものを何人にでも販売できます。\nやり方まとめました👇\n#副業 #お金の勉強 #Notion活用\nhttps://note.com/clean_viola6871/n/nf44a41cc0dcd"},{"num":"02","label":"共感フック","body":"副業でずっと「手を動かした分しか稼げない」ことに引っかかっていました。\n時間を切り売りする感覚から抜け出したくて、テンプレート販売を始めました。\n#副業 #お金の勉強 #Notion活用\nhttps://note.com/clean_viola6871/n/nf44a41cc0dcd"},{"num":"03","label":"数字訴求","body":"「テンプレートなんて誰でも作れるものが売れるのか」\n半信半疑でしたが、実際に売ってみると、売れるテンプレートには共通点がありました。\n#副業 #お金の勉強 #Notion活用\nhttps://note.com/clean_viola6871/n/nf44a41cc0dcd"},{"num":"04","label":"逆説型","body":"Notion/Canvaは無料で使えるツール。\nそれでも「ゼロから組み立てる時間」を省く価値にお金を払ってもらえました。\n#副業 #お金の勉強 #Notion活用\nhttps://note.com/clean_viola6871/n/nf44a41cc0dcd"},{"num":"05","label":"失敗談","body":"「なんとなく需要がありそうだから」で作ったテンプレートは、あまり売れませんでした。\n自分が実際に使っているものだけが売れた、という話です。\n#副業 #お金の勉強 #Notion活用\nhttps://note.com/clean_viola6871/n/nf44a41cc0dcd"},{"num":"06","label":"悩み提起","body":"「副業、時間を切り売りするだけで積み上がらない」\nそう感じている人へ。一度作ったものが繰り返し売れる仕組みの話です。\n#副業 #お金の勉強 #Notion活用\nhttps://note.com/clean_viola6871/n/nf44a41cc0dcd"},{"num":"07","label":"スレッド導入・ノウハウ小出し1","body":"1/ 在庫ゼロ・原価ゼロで始めたNotion/Canvaテンプレート販売。\n実際に作って売ったものと、売れなかったものの違いを話します🧵"},{"num":"08","label":"具体手順","body":"最初に作ったのは、副業の収支を管理するNotionテンプレート。\n自分が「これが欲しかった」と思ったものが、そのまま他の人にも刺さりました。\n#副業 #お金の勉強 #Notion活用\nhttps://note.com/clean_viola6 え方を少し変えただけ**で、単発だった案件が定例化していきました。\n\nこの記事では、\n- なぜWebライティングの案件は単発で終わりやすいのか\n- 納品時に実際に使っている、継続提案の一言\n- 継続案件になったあとの単価・進行管理の考え方\n- 「もう発注しない」と言われないための、地味だけど効いている工夫\n\nを、私が実際にやってきたことをそのまま書いていきます。\n\n### この記事の有料パートで分かること\n\n- 納品時にそのまま使える、継続提案の文面テンプレート\n- 継続案件に転換した実際の割合と、転換しやすい案件の特徴\n- 継続化したあとの単価・進行の決め方\n- クライアントが離れていく「よくあるサイン」と、その対処法","paidPart":"## なぜWebライティングの案件は単発で終わりやすいのか\n\nいくつかの案件を経験して感じたのですが、クラウドソーシングや直接契約のライティング案件は、発注者からすると「今回の記事」だけを見て発注していることがほとんどです。納品の出来がよくても、次回発注するかどうかは、発注者側がふと思い出さない限り動かない、というのが実感でした。\n\n私なりに整理すると、**単発で終わる一番の理由は「次も頼みたい」と思われていないからではなく、「次も頼める」ということが発注者の頭に浮かんでいないから**でした。ここに気づいてから、納品のたびに「次につながる一言」を意識して添えるようにしています。\n\n## 納品時に実際に使っている継続提案の文面\n\n私が納品時に添えている一言は、こういう内容です。\n\n> 納品は以上となります。もし定例のご依頼などございましたら、フォーマットを揃えて効率化できますので、ぜひお気軽にご相談ください。\n\n意識しているのは、**「また発注してください」とお願いするのではなく、「継続すると発注側にもメリットがある」と伝わるようにすること**です。フォーマットを揃える、進行がスムーズになる、といった発注者側の利点を添えることで、営業っぽさを抑えつつ次につなげられると感じています。\n\n初回の納品時だけでなく、**2回目・3回目の納品でも同じ一言を添える**ようにしています。1回だけだと聞き流されてしまうことも多いですが、複数回にわたって同じ提案を見ることで、発注者の中で「そういえば継続をお願いできるんだった」という記憶が定着しやすくなると感じています。\n\n## 継続案件に転換した実際の割合\n\n単発案件のうち、この一言を添えるようにしてから**3割ほどが継続案件に転換**しました。すべての案件が継続化するわけではありませんが、何もしなかったときと比べると明確な差があります。\n\n継続化しやすい案件には、いくつか共通点があると感じています。私の場合、こんな3つです。\n\n- 発注者が個人事業主・小規模事業者で、継続的にコンテンツを必要としている\n- 納品物に対する修正依頼が少なく、スムーズにやり取りが進んだ案件\n- 発注者から追加の質問や感謝コメントがあった案件\n\n逆に、単発の代行会社経由の案件などは、そもそも継続の意思決定権が担当者にないことも多く、転換しにくい傾向がありました。\n\n## 継続化したあとの単価・進行管理の考え方\n\n継続案件になったあとは、**単発時よりもやや低めの単価で受けることが多い**です。これは値下げというより、「継続を前提にした分、双方の手間が減る」という位置づけで説明しています。\n\n実際、初回の打ち合わせやすり合わせにかかる時間は2回目以降でぐっと減るので、その分を単価に反映させる形にしています。もちろん、単価交渉の考え方(実績を積んだタイミングでの改定打診)は継続案件でも並行して行っています。\n\n進行管理は、月初にまとめて依頼を受け、納期を分散させて対応する形に落ち着きました。継続案件が増えてきた時期、この「まとめて受けて、分散して納品する」流れを作っておかないと、あっという間に自転車操業になりかけた経験があります。早めに仕組み化しておいてよかったと、今振り返っても思います。\n\n## クライアントが離れていく「よくあるサイン」と対処法\n\n継続案件は、ある日突然ぱたっと止まることがあります。私自身も何度か経験していて、振り返るとよくあったサインはこんな感じでした。\n\n- 発注の間隔が少しずつ空くようになる\n- フィードバックが以前より簡素になる\n- 修正依頼の理由が説明されなくなる\n\nこうしたサインに気づいたときは、こちらから「最近の記事の方向性で気になる点はないか」を一度確認するようにしています。何も聞かずに案件が減っていくのを待つより、早めに確認したほうが、修正できる余地があれば修正できますし、そうでなければ次の案件探しに早く動けます。\n\n## まとめ\n\n- Webライティングの案件が単発で終わるのは、「次も頼める」ことが発注者に伝わっていないから\n- 納品時に、発注者側のメリットを添えた継続提案の一言を複数回にわたって伝える\n- 継続化しやすい案件には特徴があり、そこを見極めて注力するのも有効\n- 継続案件は単価をやや抑えつつ、進行を仕組み化することで無理なく回せる\n- 離脱のサインに気づいたら、早めに確認する\n\n単発の案件を積み重ねるだけでも副業としては成立します。ただ、継続案件が増えてからは、営業にかける時間そのものがぐっと減って、書くこと自体に時間を使えるようになった実感があります。気になることがあれば、コメントで気軽に聞いてください。","xPosts":[{"num":"01","label":"結果訴求","body":"Webライティングの単発案件、3割が継続案件に変わりました。\nやったのは、納品時に一言添えるようにしただけです。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"02","label":"共感フック","body":"「案件は取れるのに、毎回ゼロから信頼関係を作り直すのが疲れる」\nそう感じていた時期がありました。原因は単価じゃなく、継続の仕組みでした。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"03","label":"数字訴求","body":"単発で終わる一番の理由は「次も頼みたいと思われていない」からじゃなく、「次も頼める」と発注者の頭に浮かんでいないからでした。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"04","label":"逆説型","body":"「また発注してください」とお願いするより、「継続すると発注側にもメリットがある」と伝える方が、営業っぽくならずに次につながりました。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"05","label":"失敗談","body":"1本納品して終わり、また新規開拓。この繰り返しに疲れて「割に合っているのかな」と思っていた時期がありました。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"06","label":"悩み提起","body":"「Webライティングの案件、単発で終わってしまう」\nそれ、営業していないだけかもしれません。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"07","label":"スレッド導入・ノウハウ小出し1","body":"1/ Webライティングの単発案件、3割が継続案件に変わりました。\n特別なスキルは増やしていません。納品のやり方を変えただけです🧵"},{"num":"08","label":"具体手順","body":"納品時に添えている一言、シンプルです。\n「定例のご依頼などございましたら、フォーマットを揃えて効率化できます」\nこれだけで反応が変わりました。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"09","label":"ターゲット限定","body":"・Webライティングの案件が単発で終わりがち\n・毎回ゼロから営業するのに疲れている\n・継続案件を増やしたい\nそんな人向けの話です。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"10","label":"タイミング訴求","body":"継続提案の一言、1回だけだと聞き流されがちでした。\n2回目・3回目の納品でも同じ一言を添えるようにしてから、定着率が変わりました。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"11","label":"Q&A風","body":"Q. 継続提案って営業っぽくて言いづらくない?\nA. 「発注側にもメリットがある」という伝え方にすると、思ったより自然に伝わります。\n詳しいやり方はこちら👇\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"12","label":"テンプレ公開訴求","body":"納品時に実際に使っている継続提案の文面、そのまま載せています。\n#副業 #お金の勉強 #Webライティング\n[URL]"},{"num":"13","label":"継続化しやすい案件の特徴","body":"継続化しやすい案件には共通点がありました。\n発注者のタイプ、修正依 ]"},{"num":"29","label":"スレッド3・要約系","body":"1/ Webライティングの副業で、単発案件を継続案件に変えるためにやったことを振り返ってまとめました。\n納品時の一言から進行管理まで全部書きます🧵"},{"num":"30","label":"ラストコール・落ち着いたトーン","body":"継続案件、思っているより難しくないかもしれません。\n質問があればコメントでどうぞ。\n#副業 #お金の勉強 #Webライティング\n[URL]"}],"designUrl":"https://claude.ai/code/artifact/1eb3eb03-de3a-4cea-8dae-867a525ca591"},{"date":"2026-08-25","title":"クラウドソーシングの単価、これで2倍になりました。私が実践した「値上げ交渉」のやり方","price":"480円","freePart":"「クラウドソーシングって、結局単価が上がらない」\n\n副業を始めて半年くらい経った頃、私はずっとそう感じていました。実績は少しずつ増えているのに、新しい案件を探すたびに提示される金額は最初の頃とほとんど変わらない。むしろ「実績豊富な人がたくさんいるから」と、相場より低めの金額を提示されることさえありました。\n\nこのままではいつまで経っても時給換算で割に合わない、と気づいたのが転機でした。そこから「値上げ交渉」を意識的にやるようにしたところ、半年ほどで単価がほぼ2倍になりました。特別なスキルを新しく身につけたわけではなく、やり方を変えただけです。\n\nこの記事では、\n- なぜクラウドソーシングでは単価が上がりにくいのか\n- 既存クライアントに値上げを打診したときに、実際に使った文面\n- 新規案件で最初から高めの金額を通すための提案文の作り方\n- 値上げを断られたときの対応と、それでも関係を切らない考え方\n\nを、実体験ベースでまとめます。\n\n### この記事の有料パートで分かること\n\n- 既存クライアントへの値上げ打診で実際に使った文面(そのまま使える形)\n- 新規提案で「最初から高めの金額」を通すための実績の見せ方\n- 値上げを断られたときの2つの選択肢と、私が選んだ判断基準\n- 値上げ交渉のタイミングを逃さないためのチェックリスト","paidPart":"## なぜクラウドソーシングでは単価が上がりにくいのか\n\nクラウドソーシングには、常に新しいワーカーが低い金額で参入してきます。私も最初の頃は「同じ品質なら安い方が選ばれて当然だよな」と半ば諦めていました。実際、こちらから何も言わなければ、単価はずっと据え置かれたままです。\n\n半年ほど悶々とした末に私が気づいたのは、単価が上がらない一番の理由は「発注者側に、値上げを言い出す理由が特にない」ということでした。何も言わなければ、発注者にとって今の金額のままで困ることは何もありません。逆に言えば、こちらから理由を差し出せば、交渉のテーブルには乗ってもらえるということです。\n\n## 既存クライアントへの値上げ打診で使った文面\n\n継続して発注してくれているクライアントには、実績を理由に値上げを打診しました。実際に使った文面はこのような形です。\n\n> いつもお世話になっております。おかげさまで継続してお仕事をいただき、○件の対応をさせていただきました。つきましては、今後の案件について、○月分から単価を○○円に改定させていただきたく、ご相談です。品質・対応スピードは変わらず維持いたしますので、ご検討いただけますと幸いです。\n\nここでこだわったのは、**「値上げしたい」ではなく「これだけ実績を積んだので改定したい」という事実ベースの伝え方**にすることでした。件数や継続期間という数字を入れておくと、感情的なお願いではなく、実績に基づいた妥当な提案として受け取ってもらいやすいと、何度か送るうちに実感するようになりました。\n\nタイミングも重要で、私は「継続案件が3ヶ月以上続いた」「クライアントから追加の感謝コメントをもらった」といった、関係性が良好な瞬間を選んで打診するようにしています。\n\n## 新規提案で最初から高めの金額を通す\n\n新規の案件では、そもそも最初の提示額を相場より高めに設定するようにしました。ただし、根拠なく高い金額を出すと選ばれません。私が実際にやったのは、提案文に**「なぜこの金額なのか」を実績とセットで書く**ことです。\n\n> ○○件の実績があり、平均評価は○.○です。特に△△の分野では、納期短縮・修正回数の少なさで継続発注をいただいています。今回のご依頼についても、同水準の品質でご対応いたします。\n\n安い金額を出す競合がたくさんいる中で、あえて相場よりやや高めの金額を出し、その根拠を実績でしっかり補強するようにしています。そうすると、「安いから選ぶ」以外の理由で選んでもらえることが、少しずつ増えていきました。もちろん出した提案が全部通るわけではありませんが、通った案件の単価は明らかに上がっています。\n\n## 値上げを断られたときの対応\n\nもちろん、値上げ打診がすべて通るわけではありません。私の経験では、断られたときの選択肢は大きく2つでした。\n\n1. **今の金額のまま継続する**:関係性や仕事のしやすさを優先する場合。ただし「次回また改定を相談させてください」と一言添えておくことで、次の機会につなげています\n2. **その案件からは離れ、新規開拓に時間を使う**:金額差が大きく、時給換算で割に合わないと判断した場合\n\nどちらを選ぶかは、私は「その案件が学びや実績として今後に活きるかどうか」で決めています。金額が低くても実績として強い案件は残し、そうでない案件は手放す、という感じで割り切るようにしています。\n\n## 値上げ交渉のタイミングを逃さないためのチェックリスト\n\n- 継続案件が3ヶ月以上続いているか\n- 直近で追加の感謝コメント・高評価をもらったか\n- 自分のスキル(対応スピード・品質)が明らかに上がったと言えるか\n- 直近1ヶ月の案件数・実績数を数字で言えるか\n\nこれらが揃ったタイミングで打診すると、断られにくく、関係も崩れにくいと感じています。\n\n## まとめ\n\n- クラウドソーシングで単価が上がらないのは、発注者が値上げを言い出す理由を持っていないから\n- 既存クライアントへの値上げ打診は、実績を事実ベースで伝えることが重要\n- 新規提案では、最初から高めの金額を実績とセットで提示する\n- 断られたときも関係を切らず、次の機会につなげる一言を添える\n\n単価が上がらないと感じている人ほど、一度「交渉していない」という事実に目を向けてみると、状況が変わるかもしれません。質問があればコメントで気軽にどうぞ。","xPosts":[{"num":"01","label":"結果訴求","body":"クラウドソーシングの単価、半年で2倍になりました。\n新しいスキルを身につけたわけじゃなく、やり方を変えただけです。\nやったことをまとめました👇\n#副業 #お金の勉強 #フリーランス\nhttps://note.com/clean_viola6871/n/n4137be9fece2"},{"num":"02","label":"共感フック","body":"「クラウドソーシングって、結局単価が上がらない」\nずっとそう思っていました。でも理由は単純で、交渉していなかっただけでした。\n#副業 #お金の勉強 #フリーランス\nhttps://note.com/clean_viola6871/n/n4137be9fece2"},{"num":"03","label":"数字訴求","body":"単価が上がらない一番の理由は「発注者が値上げを言い出す理由を持っていない」ことでした。\n逆に言えば、理由を出せば交渉のテーブルには乗ってもらえます。\n#副業 #お金の勉強 #フリーランス\nhttps://note.com/clean_viola6871/n/n4137be9fece2"},{"num":"04","label":"逆説型","body":"安い金額を出せば選ばれる、と思っていました。\nでも実際は、根拠を添えて相場より高めの金額を出した方が選ばれることもありました。\n#副業 #お金の勉強 #フリーランス\nhttps://note.com/clean_viola6871/n/n4137be9fece2"},{"num":"05","label":"失敗談","body":"最初の頃は「実績豊富な人がたくさんいるから」と、相場より低めの金額を提示されることもありました。\nそこから抜け出すためにやったことを書いています。\n#副業 #お金の勉強 #フリーランス\nhttps://note.com/clean_viola6871/n/n4137be9fece2"},{"num":"06","label":"悩み提起","body":"「単価交渉なんて怖くてできない」\n私も最初はそうでした。でも事実ベースで伝えれば、思ったより通ります。\n#副業 #お金の勉強 #フリーランス\nhttps://note.com/clean_viola6871/n/n4137be9fece2"},{"num":"07","la 申告、実は「経費」で損してる人が多い話","price":"480円","freePart":"副業を始めて最初の確定申告。私は正直、「税金の話は難しそうだから、とりあえず売上だけ申告しておけばいいか」と思っていました。\n\n結果、初年度は経費をほとんど計上せずに申告して、後から「あれも経費にできたのに」と気づいたものがいくつもありました。副業は本業と違って会社が源泉徴収も年末調整もしてくれません。**自分で申告し、自分で経費を計上しない限り、税金を多く払い続けることになる**という、当たり前だけど見落としがちな事実に気づいたのは2年目でした。\n\nこの記事では、私が実際につまずいたり調べたりした、\n- 副業の所得はそもそも何に分類されるのか(雑所得・事業所得の違い)\n- 申告しないとどうなるのか\n- 実際に経費として計上できる項目の具体例\n- 私が初年度に見落としていた経費と、2年目に見直した申告額の差\n- 「副業が会社にバレるかも」という不安への対処(住民税の徴収方法)\n\nを、実際に申告してみて分かったこととして書いていきます。\n\n## そもそも副業の確定申告はなぜ必要か\n\n会社員として働きながら副業をしている場合でも、副業の所得(収入から経費を引いた額)が年間20万円を超える場合は、原則として確定申告が必要です。私自身、これをちゃんと理解したのは副業を始めてしばらく経ってからでした(住民税については金額にかかわらず申告が必要になる点に注意。詳細は後述します)。\n\n正直、私も最初は「申告しなくてもバレないのでは」と考えていました。でも実際には、クラウドソーシングやプラットフォーム側から税務署に支払調書が提出されるケースもあり、申告漏れが分かれば延滞税・加算税が発生します。副業を続けていくつもりなら、最初から正しく申告する習慣をつけておいたほうが、結果的に気持ちが楽だと感じています。\n\n### この記事の有料パートで分かること\n\n- 副業で経費にできる具体的な項目一覧(通信費・PC・ソフト・家事按分の考え方)\n- 初年度に見落としていた経費と、2年目に申告額がどう変わったか\n- よくある「経費として認められにくいケース」の実例\n- 会社に副業がバレにくくなる住民税の徴収方法の選び方\n- 申告時に使ったツールと、記録の残し方","paidPart":"## 副業で経費にできる項目の具体例\n\n私も最初、この所得区分の違いがよく分からず戸惑いました。調べてみると、副業の所得は多くの場合「雑所得」、一定規模以上なら「事業所得」に分類されるようです(継続性・独立性などから総合的に判断されるため、迷う場合は税務署や税理士に確認するのが確実だと理解しています)。ただ、どちらに分類されても**収入から経費を差し引いた金額**が課税対象になるという考え方は共通です。\n\n実際に私が計上している経費の例です。\n\n- **通信費**: 副業に使っている分のインターネット代・スマホ代(按分が必要。後述)\n- **PC・周辺機器**: 副業用に購入したPC、モニター、マイク等(高額なものは減価償却の対象になる場合がある)\n- **ソフトウェア・サブスク利用料**: 文字起こしツールやAIツールの月額料金など、副業に直接使っているもの\n- **書籍・学習費**: 副業のスキルアップに使った書籍代、オンライン講座の受講料\n- **消耗品費**: 名刺、事務用品など\n\n### 家事按分の考え方\n\n自宅のネット回線やスマホのように、プライベートと副業の両方で使っているものについては、**副業で使っている割合分だけ**を経費にできます。これを「家事按分」と呼ぶことを、私は経費を調べていて初めて知りました。\n\n私の場合、副業(議事録代行)にスマホとPCを使う時間はだいたい全体の3割程度だったので、通信費の3割を経費として計上しました。「なんとなく半分」のような曖昧な按分ではなく、実際の使用時間や作業日数から根拠を説明できる割合にしておくのが安全です。\n\n## 初年度に見落としていた経費、2年目の差\n\n正直に書くと、初年度は「経費にできるものが分からない」という理由で、通信費やソフトウェア利用料をほとんど計上していませんでした。2年目、上記の項目を洗い出して申告した結果、**課税対象になる所得が初年度よりはっきり減った実感**がありました。\n\n具体的な金額は年によって変動が大きいため本記事では割愛しますが、「知らずに経費にし忘れていたものがある」というのは、副業を始めたばかりの人ほど起こりやすい失敗だと感じています。\n\n## よくある「経費として認められにくいケース」\n\n- プライベート利用がほとんどなのに全額を経費にする(按分の根拠がないと否認されやすい)\n- レシート・領収書を保管していない(証憑がないと経費として説明できない)\n- 副業と全く関係のない支出を無理に経費に含める\n\n私は経費にした支出について、レシートを月ごとにスキャンして保管し、何のための支出かを一言メモに残すようにしています。この一手間が、申告時にも税務調査が入った場合にも安心材料になります。\n\n## 会社に副業がバレにくくなる住民税の設定\n\n副業を始めた当初、私が一番気になっていたのが「会社にバレないか」でした。副業が会社に知られる経路の一つが、住民税の金額です。会社員の住民税は通常、給与から天引き(特別徴収)されますが、確定申告の際に**「自分で納付(普通徴収)」を選択**することで、副業分の住民税を自分で納付でき、給与天引き額に副業分の住民税が反映されにくくなります。\n\n確定申告書の第二表に「給与、公的年金等以外の所得に係る住民税の徴収方法」を選ぶ欄があるので、そこで「自分で納付」を選択します。ただし自治体によって運用が異なる場合があるため、心配な場合はお住まいの自治体に確認しておくと安心です。\n\n## 申告時に使っているツールと記録の残し方\n\n私は、収入と経費を月ごとに表計算ソフトで記録し、確定申告の時期に会計ソフト(freeeやマネーフォワード クラウド確定申告など)に取り込む形で申告しています。日々の記録さえきちんとしておけば、申告期(2〜3月)にまとめて慌てる必要がなくなりました。\n\n## まとめ\n\n- 副業の所得(年間20万円超などの目安)には原則として確定申告が必要\n- 通信費・PC・ソフト利用料・学習費など、経費にできる項目は意外と多い\n- 家事按分は「根拠を説明できる割合」にしておくことが重要\n- レシート・領収書の保管と用途メモが、申告時・調査時の安心材料になる\n- 住民税を「自分で納付」にすることで、会社に副業が伝わりにくくなる\n\n繰り返しになりますが、本記事はあくまで一般的な情報整理です。個別の状況によって判断が変わる部分も多いため、迷ったときは税理士や税務署に確認しながら進めることをおすすめします。質問があればコメントで気軽にどうぞ。","xPosts":[{"num":"01","label":"問題提起","body":"副業の確定申告、経費をちゃんと計上できていますか?\n私は初年度、通信費もソフト代もほとんど計上せずに申告して、後から後悔しました。\n見落としがちな経費、まとめました👇\n#副業 #お金の勉強 #確定申告\nhttps://note.com/clean_viola6871/n/nffd84aa4f6bc"},{"num":"02","label":"共感フック","body":"「税金の話は難しそうだから、売上だけ申告しておけばいいか」\n初年度の自分はそう思っていました。結果、経費で損していたことに2年目に気づきました。\n#副業 #お金の勉強 #確定申告\nhttps://note.com/clean_viola6871/n/nffd84aa4f6bc"},{"num":"03","label":"具体項目訴求","body":"副業の経費、通信費・PC・ソフト利用料・書籍代・消耗品費…\n「知らなかった」で計上し忘れているものがあるかもしれません。\n#副業 #お金の勉強 #確定申告\nhttps://note.com/clean_viola6871/n/nffd84aa4f6bc"},{"num":"04","label":"数字訴求","body":"年間20万円超の副業所得がある会社員は、原則として確定申告が必要です。\n知っているようで、意外と見落としがちなポイントをまとめました。\n#副業 #お金の勉強 #確定申告\nhttps://note.com/clean_viola6871/n/nffd84aa4f6bc"},{"num":"05","label":"悩み提起","body":"「副業、会社にバレないかな」\nこれ、住民税の徴収方法の選び方で対策できます。\n#副業 #お金の勉強 #確定申告\nhttps://note.com/clean_viola6871/n/nffd84aa4f6bc"},{"num":"06","label":"失敗談","body":"初年度、経費をほとんど計上せずに申告しました。\n2年目に見直したら、課税対象になる所得がはっきり減りました。\n#副業 #お金の勉強 #確定申告\nhttps://note.com/clean_viola6871/n/nffd84aa4 副業のはじめ方","price":"480円","freePart":"「副業を始めたいけど、動画編集もライティングもスキルがない」\n「本業が忙しくて、まとまった時間が取れない」\n\nそんな人に向いているのが、**AIを使った議事録・要約代行**です。\n\n正直、最初にこの話を人から聞いたときは半信半疑でした。特別なスキルはいりません。必要なのは、AI文字起こしツールの使い方と、ちょっとしたチェックの手間だけ。私は本業の合間、通勤時間と昼休みだけを使って、始めて2ヶ月目に月3万円を安定して稼げるようになりました。\n\nこの記事では、\n- なぜ「AI議事録・要約代行」が今ねらい目なのか\n- 実際に使っているツールと具体的な作業フロー\n- 案件の獲得方法(実際に使った文言つき)\n- 私の1ヶ月目・2ヶ月目のリアルな収支\n\nを、実体験ベースで包み隠さず書きます。\n\n## なぜ今「AI議事録・要約代行」なのか\n\nきっかけは、知人が「オンライン会議は増えたのに、議事録を取る人がいないし、取っても誰も整形する時間がない」とこぼしていたことでした。試しにクラウドソーシングサイトを覗いてみると、同じような悩みを抱えた発注者が意外と多くて、「これ、需要あるじゃん」と思ったのを覚えています。\n\n一方でAI文字起こしの精度はもう十分上がっていて、ゼロから耳で聞き取る必要はありません。足りていないのは、AIの出力をそのまま納品せず**読める形に整える人**、誤字や発言者の取り違えを直せる人、要点を3行でまとめられる人。つまり「AIと発注者の間に立つ人」です。私はこのポジションに、参入障壁の低さと需要のギャップを感じて飛び込みました。\n\n### この記事の有料パートで分かること\n\n- 使用ツール3つの具体的な使い分け(無料枠だけでどこまでできるか)\n- 初案件の獲得に使ったクラウドソーシングの提案文テンプレート\n- 1件あたりの相場と、私の1ヶ月目・2ヶ月目の収支表\n- 実際にあったクレーム事例と、その対処法\n- 継続案件につなげるための納品時の一工夫","paidPart":"## 使っているツールと使い分け\n\n### 1. 文字起こし:AI議事録ツール(無料枠中心)\n\nまずは無料枠のある文字起こしツールで音声をテキスト化します。最初のころ、無料枠の残り分数を確認せずに1時間の会議音声を突っ込んでしまい、途中で有料課金に切り替わって利益がほぼ吹き飛んだことがありました。それ以来、案件の音声時間を受注前に必ず確認するようにしています。\n\n今は月あたりの案件数を見ながら、無料枠と低価格プランを使い分けています(具体的な時間換算の目安は後述の収支表を参照)。\n\n### 2. 整形・要約:チャット型AI\n\n文字起こしの生データは、フィラー(「えー」「あの」)や言い間違いがそのまま入っています。これをチャット型AIに「発言者ごとに整理し、フィラーを除去し、決定事項とToDoを箇条書きで抽出して」という指示で整形させます。\n\n正直、最初はAIの出力をわりと信じてしまいそうになりました。でも**AIの出力を鵜呑みにしない**が鉄則です。特に固有名詞(社名・製品名)や数字は誤変換が起きやすいので、必ず自分の耳で元音声の該当箇所を聞き直してチェックしています。この一手間が「AIそのままの納品」と「代行サービスとして値段が付く納品」の差になっている、というのが実感です。\n\n### 3. 納品フォーマット\n\n決定事項・ToDo(担当者と期限つき)・議事内容の3ブロック構成にすると、発注者からの評価が明確に上がりました。テンプレートの具体的な項目立ては次の通りです。\n\n- 会議名/日時/参加者\n- 決定事項(箇条書き)\n- ToDo(担当者・期限を明記)\n- 詳細議事(発言者ごと、時系列)\n- 要約(3行)\n\n## 初案件の獲得方法\n\nいきなり高単価案件は取れません。最初の1〜2件は実績作りと割り切り、クラウドソーシングサイトで「議事録作成」「文字起こし 整形」といったキーワードで検索し、以下のような提案文を送りました。\n\n> はじめまして。AI文字起こしツールとChatGPTを組み合わせて、発言者整理・誤字修正・決定事項とToDoの抽出まで行った議事録を作成しています。まずは実績作りのため、通常より抑えた価格でご提案させていただければと思います。サンプルとして、○分程度の音声を無料でお試し納品することも可能です。\n\n「無料お試し納品」を提示したことで、初回の返信率が大きく上がりました。実績ゼロの状態を突破する一番のコツは、ここだと感じています。\n\n## 1ヶ月目・2ヶ月目の収支(実数ベース)\n\n- 1ヶ月目:案件4件、単価1,500〜2,500円、ツール課金差し引きで手残り 約7,000円\n- 2ヶ月目:継続案件2件が定例化、新規2件を追加し、手残り 約31,000円\n\n金額としては大きくありませんが、**1件あたりの作業時間は音声30分につき40〜60分程度**なので、通勤時間・昼休みだけで完結する副業としては時給換算の効率が良い部類だと感じています。\n\n## 実際にあったクレームと対処法\n\n一度、発言者の取り違え(似た声質の2名を混同)を指摘されたことがあります。この経験から、複数名が参加する音声では「冒頭で誰が何を話したか」を必ず確認するルールを自分に課しました。また、納品時に「発言者の判定に自信がない箇所」を注記として残す運用に変えてからは、同様のクレームはなくなりました。\n\n## 継続案件につなげる一工夫\n\n単発で終わらせないために、納品時に「次回、定例会議の議事録も継続してご依頼いただく場合、フォーマットを揃えて効率化できます」と一言添えるようにしています。これだけで、単発案件のうち3割ほどが継続案件に転換しました。\n\n## まとめ\n\n始める前は、正直「AIに丸投げすれば稼げるんでしょ」くらいに思っていました。でも実際にやってみると、差がつくのはむしろ逆で、AIの出力をそのまま出さずに人の目でチェックし整える、そのひと手間だったなと感じています。\n\n- AI議事録・要約代行は、特別なスキルなしでもスキマ時間で始められる\n- 最初の実績づくりには「無料お試し納品」が効果的だった\n- 納品フォーマットの型化と、継続提案の一言で単価と継続率が上がる\n\n今日から始められる副業として、参考にしていただければ嬉しいです。質問があればコメントで気軽にどうぞ。","xPosts":[{"num":"01","label":"結果訴求","body":"通勤時間と昼休みだけで、副業2ヶ月目に月3万円。\nやっていることは「AIが文字起こしした議事録を、人の目で整えて納品する」だけでした。\n動画編集もライティングスキルも不要。\nやり方まとめました👇\n#副業 #お金の勉強 #在宅ワーク\nhttps://note.com/clean_viola6871/n/n6937d09c1677"},{"num":"02","label":"共感フック","body":"「副業したいけど、スキルも時間もない」\nそんな自分が唯一続けられたのが、AIの出力を整えるだけの「議事録・要約代行」でした。\n#副業 #お金の勉強 #在宅ワーク\nhttps://note.com/clean_viola6871/n/n6937d09c1677"},{"num":"03","label":"数字訴求","body":"1件あたりの作業時間、音声30分につき40〜60分。\nこれがスキマ時間副業として続けられている一番の理由かもしれません。\n#副業 #お金の勉強 #在宅ワーク\nhttps://note.com/clean_viola6871/n/n6937d09c1677"},{"num":"04","label":"逆説型","body":"AIが文字起こしできるようになって、「文字起こしの価値」はほぼゼロになった。\nでも「AIの出力を人が読める形に整える」仕事は、逆に需要が増えている。\n#副業 #お金の勉強 #在宅ワーク\nhttps://note.com/clean_viola6871/n/n6937d09c1677"},{"num":"05","label":"失敗談","body":"無料枠の残り分数を確認せずに1時間の音声を突っ込んで、利益が吹き飛んだことがあります。\nそれ以来、受注前に必ず音声時間を確認するようになりました。\nこういう地味な失敗談も込みで書いてます👇\n#副業 #お金の勉強 #在宅ワーク\nhttps://note.com/clean_viola6871/n/n6937d09c1677"},{"num":"06","label":"悩み提起","body":"「実績ゼロで案件が取れない」\n副業を始めた誰もがぶつかる壁だと思います。私はある一工夫の提案文でここを突破しました。\n#副業 #お金の勉強 #在宅ワーク\nhttps://note.com/clean_viola6871/n/n6937d09c1677"},{"num":"07","label":"スレッド導入・ノウハウ小出し1","body":"1/ AIが普及して「文字起こし」の価値はゼロになった。\nでも「AIの出力を、人が読める形に整える」仕事は、逆に需要が増え const iconCopy = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const iconCheck = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>';
const iconExternal = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';

function copyText(text, btn) {
  const done = () => {
    const original = btn.dataset.originalLabel || btn.innerHTML;
    btn.dataset.originalLabel = original;
    btn.innerHTML = iconCheck + ' <span>コピーしました</span>';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove('copied');
    }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

// noteの編集画面はリッチテキストエディタで、素のMarkdown記法(## や **)は
// そのまま文字として貼り付けられてしまう。貼り付け先が解釈できるよう
// text/html も一緒にクリップボードへ載せ、実際の見出し・太字として反映されるようにする。
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inlineMd(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// 行単位の状態遷移でHTML化する(見出しの直後にリストが続く、リストの後に
// 地の文が続く、といった「空行を挟まない混在パターン」にも対応するため)
function markdownToHtml(md) {
  const lines = md.split('\n');
  const html = [];
  let mode = null; // null | 'p' | 'ul' | 'ol' | 'quote'

  function close() {
    if (mode === 'p') html.push('</p>');
    else if (mode === 'ul') html.push('</ul>');
    else if (mode === 'ol') html.push('</ol>');
    else if (mode === 'quote') html.push('</p></blockquote>');
    mode = null;
  }

  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed === '') { close(); continue; }

    let m;
    if ((m = /^###\s+(.*)$/.exec(trimmed))) {
      close(); html.push(`<h3>${inlineMd(m[1])}</h3>`);
    } else if ((m = /^##\s+(.*)$/.exec(trimmed))) {
      close(); html.push(`<h2>${inlineMd(m[1])}</h2>`);
    } else if ((m = /^-\s+(.*)$/.exec(trimmed))) {
      if (mode !== 'ul') { close(); html.push('<ul>'); mode = 'ul'; }
      html.push(`<li>${inlineMd(m[1])}</li>`);
    } else if ((m = /^\d+\.\s+(.*)$/.exec(trimmed))) {
      if (mode !== 'ol') { close(); html.push('<ol>'); mode = 'ol'; }
      html.push(`<li>${inlineMd(m[1])}</li>`);
    } else if ((m = /^>\s?(.*)$/.exec(trimmed))) {
      if (mode !== 'quote') { close(); html.push('<blockquote><p>'); mode = 'quote'; }
      else html.push('<br>');
      html.push(inlineMd(m[1]));
    } else {
      if (mode !== 'p') { close(); html.push('<p>'); mode = 'p'; }
      else html.push('<br>');
      html.push(inlineMd(trimmed));
    }
  }
  close();
  return html.join('');
}

// リッチテキスト非対応の貼り付け先向けに、Markdown記号を取り除いた
// 読みやすいプレーンテキストも作る(プレビュー表示にも流用)
function markdownToPlainText(md) {
  return md
    .split('\n')
    .map((line) => line
      .replace(/^###\s+/, '')
      .replace(/^##\s+/, '')
      .replace(/^-\s+/, '・')
      .replace(/^>\s?/, ''))
    .join('\n')
    .replace(/\*\*(.+?)\*\*/g, '$1');
}

function copyRichText(md, btn) {
  const done = () => {
    const original = btn.dataset.originalLabel || btn.innerHTML;
    btn.dataset.originalLabel = original;
    btn.innerHTML = iconCheck + ' <span>コピーしました</span>';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove('copied');
    }, 1600);
  };
  const plain = markdownToPlainText(md);
  const html = markdownToHtml(md);
  if (navigator.clipboard && window.isSecureContext && window.ClipboardItem) {
    const item = new ClipboardItem({
      'text/plain': new Blob([plain], { type: 'text/plain' }),
      'text/html': new Blob([html], { type: 'text/html' }),
    });
    navigator.clipboard.write([item]).then(done).catch(() => copyText(plain, btn));
  } else {
    copyText(plain, btn);
  }
}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${parseInt(m)}/${parseInt(d)}`;
}

// 投稿済みチェックはこの端末のブラウザだけに保存する(他の端末・他の人には共有されない)
function postKey(date, num) {
  return `note-kit-posted:${date}:${num}`;
}

function isPostPosted(date, num) {
  try {
    return localStorage.getItem(postKey(date, num)) === '1';
  } catch (e) {
    return false;
  }
}

function setPostPosted(date, num, posted) {
  try {
    if (posted) localStorage.setItem(postKey(date, num), '1');
    else localStorage.removeItem(postKey(date, num));
  } catch (e) {
    // 保存できない環境(プライベートブラウズ等)ではチェックが保持されないだけで、コピー機能自体には影響しない
  }
}

function buildDayPanel(day, index) {
  const panel = document.createElement('section');
  panel.className = 'day-panel';
  panel.dataset.active = index === 0 ? 'true' : 'false';
  panel.id = `panel-${day.date}`;
  panel.setAttribute('role', 'tabpanel');

  // 記事カード
  const articleCard = document.createElement('div');
  articleCard.className = 'card';
  articleCard.innerHTML = `
    <div class="card-head"><span class="label">note有料記事</span></div>
    <div class="article-title"></div>
    <div style="margin-bottom:14px;"><span class="price-chip"></span></div>
  `;
  articleCard.querySelector('.article-title').textContent = day.title;
  articleCard.querySelector('.price-chip').textContent = `¥ ${day.price}`;

  const titleBtn = document.createElement('button');
  titleBtn.className = 'btn btn-outline';
  titleBtn.innerHTML = iconCopy + ' <span>タイトルをコピー</span>';
  titleBtn.addEventListener('click', () => copyText(day.title, titleBtn));
  articleCard.appendChild(titleBtn);
  panel.appendChild(articleCard);

  // 無料/有料パート
  [
    { key: 'freePart', label: '無料パート(冒頭に貼り付け)', text: day.freePart },
    { key: 'paidPart', label: '有料パート(「続きを読むには」の後に貼り付け)', text: day.paidPart },
  ].forEach(({ label, text }) => {
    if (!text) return;
    const card = document.createElement('div');
    card.className = 'card';
    const previewId = `prev-${day.date}-${Math.random().toString(36).slice(2, 8)}`;
    card.innerHTML = `
      <div class="card-head">
        <span class="label">${label}</span>
        <span class="char-count">${text.length.toLocaleString()}文字</span>
      </div>
      <div class="preview" id="${previewId}"></div>
      <button class="expand-toggle" type="button">全文を表示</button>
    `;
    card.querySelector('.preview').textContent = markdownToPlainText(text);
    const preview = card.querySelector('.preview');
    const toggle = card.querySelector('.expand-toggle');
    toggle.addEventListener('click', () => {
      const expanded = preview.classList.toggle('expanded');
      toggle.textContent = expanded ? '折りたたむ' : '全文を表示';
    });
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-primary';
    copyBtn.innerHTML = iconCopy + ' <span>本文をコピー(見出し・太字も反映)</span>';
    copyBtn.addEventListener('click', () => copyRichText(text, copyBtn));
    card.appendChild(copyBtn);
    panel.appendChild(card);
  });

  // デザインリンク(このページはサンドボックスされたiframe内で動くため、
  // target="_blank" のリンク遷移がタップしても反応しないことがある。
  // 確実に動くコピー方式を主導線にし、リンクは補助的に添える)
  if (day.designUrl) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head"><span class="label">表紙・告知画像</span></div>
      <div class="design-note">表紙デザイン10パターンのページです。URLをコピーして、ブラウザで開いてください。</div>
      <div class="url-display"></div>
    `;
    card.querySelector('.url-display').textContent = day.designUrl;

    const copyUrlBtn = document.createElement('button');
    copyUrlBtn.className = 'btn btn-primary';
    copyUrlBtn.innerHTML = iconCopy + ' <span>デザイン案のURLをコピー</span>';
    copyUrlBtn.addEventListener('click', () => copyText(day.designUrl, copyUrlBtn));
    card.appendChild(copyUrlBtn);

    const fallbackLink = document.createElement('a');
    fallbackLink.className = 'fallback-link';
    fallbackLink.href = day.designUrl;
    fallbackLink.target = '_blank';
    fallbackLink.rel = 'noopener';
    fallbackLink.innerHTML = `<span>このリンクで開けることもあります</span>${iconExternal}`;
    card.appendChild(fallbackLink);

    panel.appendChild(card);
  }

  // Xポスト
  const xCard = document.createElement('div');
  xCard.className = 'card';
  const xPosts = day.xPosts || [];
  xCard.innerHTML = `
    <div class="card-head">
      <span class="label">X告知ポスト</span>
      <span class="char-count" data-progress></span>
    </div>
    <div class="x-note">1日2本(朝7:30/夜21:00)を目安に、2週間かけて投稿する想定です。投稿したらチェックを付けると、次に投稿するものが分かりやすくなります(このチェックはこの端末だけに保存されます)。[URL] は note記事の公開後にURLを差し替えてください。</div>
  `;
  const progressEl = xCard.querySelector('[data-progress]');
  const list = document.createElement('div');
  list.className = 'x-list';

  const updateProgress = () => {
    const done = xPosts.filter((p) => isPostPosted(day.date, p.num)).length;
    progressEl.textContent = `${done}/${xPosts.length}本 投稿済み`;
  };

  const refreshNextUp = () => {
    list.querySelectorAll('.x-item').forEach((el) => el.classList.remove('next-up'));
    const next = Array.from(list.querySelectorAll('.x-item')).find((el) => !el.classList.contains('posted'));
    if (next) next.classList.add('next-up');
  };

  xPosts.forEach((post) => {
    const item = document.createElement('div');
    item.className = 'x-item';
    item.innerHTML = `
      <div class="x-item-head">
        <span class="x-num"></span><span class="x-label"></span>
        <span class="next-badge">次はこれ</span>
        <label class="x-posted-toggle">
          <input type="checkbox" />
          <span>投稿済み</span>
        </label>
      </div>
      <div class="x-body"></div>
    `;
    item.querySelector('.x-num').textContent = `#${post.num}`;
    item.querySelector('.x-label').textContent = post.label;
    item.querySelector('.x-body').textContent = post.body;

    const checkbox = item.querySelector('input[type="checkbox"]');
    const applyState = (posted) => {
      item.classList.toggle('posted', posted);
      checkbox.checked = posted;
    };
    applyState(isPostPosted(day.date, post.num));
    checkbox.addEventListener('change', () => {
      setPostPosted(day.date, post.num, checkbox.checked);
      applyState(checkbox.checked);
      updateProgress();
      refreshNextUp();
    });

    const btn = document.createElement('button');
    btn.className = 'btn btn-outline';
    btn.innerHTML = iconCopy + ' <span>コピー</span>';
    btn.addEventListener('click', () => copyText(post.body, btn));
    item.appendChild(btn);
    list.appendChild(item);
  });
  xCard.appendChild(list);
  panel.appendChild(xCard);

  updateProgress();
  refreshNextUp();

  return panel;
}

function render() {
  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main');
  const countEl = document.getElementById('day-count');

  if (!DAYS || DAYS.length === 0) {
    mainEl.innerHTML = '<div class="empty">まだ記事がありません</div>';
    return;
  }

  countEl.textContent = `全${DAYS.length}日分`;

  DAYS.forEach((day, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.textContent = fmtDate(day.date);
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', 'false'));
      document.querySelectorAll('.day-panel').forEach((p) => (p.dataset.active = 'false'));
      tab.setAttribute('aria-selected', 'true');
      document.getElementById(`panel-${day.date}`).dataset.active = 'true';
    });
    tabsEl.appendChild(tab);

    mainEl.appendChild(buildDayPanel(day, i));
  });
}

render();
</script>
