// ゆるい判定用の正規化：カタカナ→ひらがな、大小仮名の統一、長音・記号・空白の除去
function norm(s){
  if(!s)return "";
  s=s.trim().toLowerCase();
  s=s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); // カナ→かな
  const sm={"ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","ゃ":"や","ゅ":"ゆ","ょ":"よ","っ":"つ","ゎ":"わ","ゕ":"か","ゖ":"け"};
  s=s.replace(/[ぁぃぅぇぉゃゅょっゎゕゖ]/g,c=>sm[c]); // 小書き→大書きに統一
  s=s.replace(/[ー\-\s―–、。・]/g,""); // 長音・記号・空白除去
  s=s.replace(/[ぢ]/g,"じ").replace(/[づ]/g,"ず"); // ぢ/づ の揺れ吸収
  return s;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  inp.focus();

function showFb(ok,d){
  answered=true;

  const fb=document.getElementById('fb');fb.className='fb '+(ok?'correct':'wrong');

  document.getElementById('answerCtrl').classList.add('hidden');
  document.getElementById('nextCtrl').classList.remove('hidden');
}
function check(){
  if(answered)return;
  const d=DATA[order[idx]];
  const inp=norm(document.getElementById('inp').value);
  // 種別なしの読み(d.y)でも、種別まで付けた読みでも正解にする
  const suf={"市":"し","区":"く","町":["まち","ちょう"],"村":["むら","そん"]};
  let accepts=[norm(d.y)];
  const s=suf[d.t];
  if(s){(Array.isArray(s)?s:[s]).forEach(x=>accepts.push(norm(d.y+x)));}
  const ok=accepts.includes(inp);
  if(ok)score++;
  showFb(ok,d);
}
function giveup(){if(answered)return;showFb(false,DATA[order[idx]]);}
function next(){idx++;if(idx>=DATA.length)finish();else render();}
function rankOf(p){
  if(p>=95)return{t:"難読マスター",e:"🏆",m:"ほぼ完璧！全国の難読地名を制覇するレベルです。"};
  if(p>=80)return{t:"難読エキスパート",e:"🥇",m:"かなりの地名通。あと一歩でマスターです！"};
  if(p>=60)return{t:"地名ツウ",e:"🎉",m:"なかなかの実力。読めた町も多かったのでは？"};
  if(p>=30)return{t:"見習い探検家",e:"👍",m:"半分近く正解！ここから覚えていきましょう。"};
  return{t:"難読ビギナー",e:"📖",m:"難読ぞろいでしたね。ぜひ再挑戦を！"};
}
function finish(){
  document.getElementById('game').classList.add('hidden');
  const r=document.getElementById('result');r.classList.remove('hidden');
  document.getElementById('scoreNum').textContent=score;
  const info=rankOf(score);
  document.getElementById('rank').textContent=info.e+' 称号：'+info.t;
  document.getElementById('rmsg').textContent=info.m;
  // Xシェア
  const url='https://machi-chou-quiz.com/nandoku-quiz/';
  const text='難読自治体名クイズ 100問に挑戦！\n100問中'+score+'問正解、称号は【'+info.t+'】でした'+info.e+'\nあなたはいくつ読める？';
  const tags='#難読地名 #難読自治体名クイズ';
  const share='https://x.com/intent/tweet?text='+encodeURIComponent(text+'\n'+tags+'\n')+'&url='+encodeURIComponent(url);
  document.getElementById('shareX').href=share;
}
start();
</script>
</body></html>
